name: Build AAB API 36 Auditado

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # ID exclusivo para la nueva app en Play Console (cámbialo solo si tu app ya fijó otro ID)
  APP_ID: "com.kronexs.notespro"
  VERSION_BASE: 100

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node 20 & Java 21
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Instalar Android SDK 36 y Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: 4. Crear Proyecto Capacitor Limpio
        run: |
          rm -rf android node_modules package-lock.json mobile-app capacitor.config.*
          mkdir -p mobile-app

          cat << EOF > package.json
          {
            "name": "kronexs-notes-pro",
            "version": "1.0.0",
            "description": "Organizador de notas y tareas diarias",
            "main": "mobile-app/index.html",
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            }
          }
          EOF

          cat << EOF > capacitor.config.json
          {
            "appId": "${APP_ID}",
            "appName": "Kronexs Notes",
            "webDir": "mobile-app",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          cat << 'EOF' > mobile-app/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>Kronexs Notes</title>
            <style>
              * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
              body { margin: 0; background: #0B0E14; color: #F8FAFC; padding: 20px; }
              .card { background: #161B26; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
              h1 { font-size: 20px; margin: 0 0 4px 0; color: #F59E0B; }
              p.sub { font-size: 12px; color: #94A3B8; margin: 0 0 16px 0; }
              input, textarea, select { width: 100%; background: #0B0E14; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; }
              button.primary { width: 100%; background: #F59E0B; color: #0B0E14; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
              .note-item { background: #0B0E14; border-left: 4px solid #F59E0B; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: start; }
              .note-title { font-weight: 700; font-size: 14px; color: #F8FAFC; }
              .note-cat { font-size: 11px; color: #F59E0B; text-transform: uppercase; }
              .note-body { font-size: 13px; color: #CBD5E1; margin-top: 4px; }
              .del-btn { background: #EF4444; color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 11px; cursor: pointer; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Kronexs Notes</h1>
              <p class="sub">Organizador personal de tareas, ideas y recordatorios diarios.</p>
              <input id="title" type="text" placeholder="Título de la tarea o nota..." />
              <select id="category">
                <option value="Trabajo">📌 Trabajo</option>
                <option value="Personal">🏠 Personal</option>
                <option value="Finanzas">📊 Presupuesto</option>
              </select>
              <textarea id="content" rows="3" placeholder="Escribe el detalle aquí..."></textarea>
              <button class="primary" onclick="addNote()">+ Guardar Nota</button>
            </div>
            <div class="card">
              <h1 style="font-size:16px; margin-bottom:12px;">Mis Notas Guardadas</h1>
              <div id="list"></div>
            </div>
            <script>
              let notes = JSON.parse(localStorage.getItem('kx_notes') || '[{"title":"Bienvenido a Kronexs Notes","cat":"Personal","body":"Crea y organiza tus notas diarias sin conexión."}]');
              function render() {
                const el = document.getElementById('list');
                if (!notes.length) { el.innerHTML = '<p class="sub">No hay notas registradas.</p>'; return; }
                el.innerHTML = notes.map((n, i) => `
                  <div class="note-item">
                    <div>
                      <span class="note-cat">${n.cat}</span>
                      <div class="note-title">${n.title}</div>
                      <div class="note-body">${n.body}</div>
                    </div>
                    <button class="del-btn" onclick="delNote(${i})">Borrar</button>
                  </div>
                `).join('');
              }
              function addNote() {
                const title = document.getElementById('title').value.trim();
                const cat = document.getElementById('category').value;
                const body = document.getElementById('content').value.trim();
                if (!title || !body) return;
                notes.unshift({ title, cat, body });
                localStorage.setItem('kx_notes', JSON.stringify(notes));
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                render();
              }
              function delNote(i) {
                notes.splice(i, 1);
                localStorage.setItem('kx_notes', JSON.stringify(notes));
                render();
              }
              render();
            </script>
          </body>
          </html>
          EOF

      - name: 5. Configurar Gradle con API 36 Nativo
        run: |
          npm install
          npx cap add android

          VER_CODE=$(( ${{ env.VERSION_BASE }} + ${{ github.run_number }} ))

          # 1. Definir API 36 en variables.gradle (que leen todos los submodulos de Capacitor)
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.9.2'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.13.1'
              androidxFragmentVersion = '1.8.4'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.12.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

          # 2. Definir android/app/build.gradle limpio apuntando a variables.gradle y API 36
          cat << EOF > android/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "${APP_ID}"
              compileSdk rootProject.ext.compileSdkVersion
              defaultConfig {
                  applicationId "${APP_ID}"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode ${VER_CODE}
                  versionName "1.0.${VER_CODE}"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }

          repositories {
              flatDir{
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:\$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:\$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:\$coreSplashScreenVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:\$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:\$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:\$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }

          apply from: 'capacitor.build.gradle'
          EOF

          npx cap sync android

      - name: 6. Compilar AAB y Auditar API 36 con Bundletool
        run: |
          KEYSTORE_FILE="$GITHUB_WORKSPACE/release-key.jks"

          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias unsol_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass Kronexs2026! \
              -keypass Kronexs2026! \
              -dname "CN=Kronexs, OU=Mobile, O=Kronexs, L=Tacna, ST=Tacna, C=PE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release-key.jks
            git commit -m "Guardar keystore oficial [skip ci]" || true
            git push || true
          fi

          echo "=== HUELLA SHA1 USADA ==="
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass Kronexs2026! | grep "SHA1:"

          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password=Kronexs2026! \
            -Pandroid.injected.signing.key.alias=unsol_key \
            -Pandroid.injected.signing.key.password=Kronexs2026!

          VER_CODE=$(( ${{ env.VERSION_BASE }} + ${{ github.run_number }} ))
          AAB_OUT="$GITHUB_WORKSPACE/kronexs-api36-v${VER_CODE}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB_OUT"

          # Auditoria real del archivo .aab con Google Bundletool
          curl -sL https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar -o /tmp/bundletool.jar
          TARGET_SDK=$(java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB_OUT" --xpath="/manifest/uses-sdk/@android:targetSdkVersion")
          VERSION_CODE=$(java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB_OUT" --xpath="/manifest/@android:versionCode")
          PACKAGE_NAME=$(java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB_OUT" --xpath="/manifest/@package")

          echo "========================================="
          echo "AUDITORIA INTERNA DEL AAB GENERADO:"
          echo "Package ID     : $PACKAGE_NAME"
          echo "Version Code   : $VERSION_CODE"
          echo "Target SDK API : $TARGET_SDK"
          echo "========================================="

          if [ "$TARGET_SDK" != "36" ]; then
            echo "ERROR CRITICO: El AAB no tiene Target SDK 36 (tiene $TARGET_SDK)"
            exit 1
          fi

      - name: 7. Subir AAB Verificado
        uses: actions/upload-artifact@v4
        with:
          name: AAB-AUDITADO-API36
          path: |
            kronexs-api36-v*.aab
